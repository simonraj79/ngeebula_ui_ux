# Single shared demo: SQLite resets when the free instance restarts.
services:
  - type: web
    name: ngeebula-ui-ux
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: python scripts/build_render.py
    startCommand: python scripts/start_render.py
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
